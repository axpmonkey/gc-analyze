[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "gc-analyze"
version = "6.0.0"
description = "JVM GC log analyzer: G1, Parallel, CMS and Serial; Java 8 and unified logging"
requires-python = ">=3.14,<3.16"
dependencies = [
    "pydantic>=2.14.3",
    "typer>=0.29.1",
    "rich>=15.0.0",
]

[project.scripts]
gc-analyze = "gc_analyze.cli:app"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PERF", "PTH", "PL", "PIE", "RUF", "Q"]
ignore = [
    "PLR0911",  # Too many return statements (acceptable for guard clauses)
    "PLR0912",  # Too many branches (acceptable for complex diagnostic logic)
    "PLR0913",  # Too many arguments (render/export functions need diagnostic context)
    "PLR0917",  # Preserve existing CLI and parser positional parameter signatures
    "PLR0915",  # Too many statements (render function is necessarily large)
    "PLR2004",  # Magic values (meaningful in GC analysis context: 90%, 60s, etc.)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnknownParameterType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.5",
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
]
